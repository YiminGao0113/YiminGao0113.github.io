# Site settings. The theme is a vendored copy of Minimal Light
# (https://github.com/yaoyao-liu/minimal-light, CC0), extended with subpages
# for projects and a data-driven publication list.

title: Yimin Gao
position: Ph.D. Student
affiliation: University of Virginia
affiliation_link: https://engineering.virginia.edu/departments/electrical-and-computer-engineering
email: yg9bq@virginia.edu
description: "PhD student in Electrical and Computer Engineering at the University of Virginia, building efficient and secure hardware for edge AI — accelerator architecture, hardware-software co-design, and full-stack NPU profiling."
url: https://yimingao0113.github.io
baseurl: ""
lang: en-US

# Sidebar links. Delete a line to hide its icon.
google_scholar: https://scholar.google.com/citations?user=_PeancYAAAAJ&hl=en
cv_link: /files/Yimin_Gao_CV.pdf
github_link: https://github.com/YiminGao0113
linkedin: https://www.linkedin.com/in/yimin-gao-a357a2246
orcid: https://orcid.org/0009-0002-9526-6954

avatar: /images/profile.jpg

# "Powered by Jekyll and Minimal Light" line at the bottom of each page.
enable_footnote: true

# Publications are grouped on the homepage by the `category` front matter
# field, in this order.
publication_category:
  conferences:
    title: Conference Papers
  manuscripts:
    title: Journal Articles
  patents:
    title: Patents

collections:
  publications:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: { path: "" }
    values: { layout: default }

future: true
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-seo-tag

# Pages live in _pages/, which Jekyll skips by default (leading underscore).
include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
