{% include base_path %}

<!-- start custom head snippets -->

<!-- Apply a saved theme choice before first paint.
     site.default_theme decides what a first-time visitor sees, by controlling
     whether the <html> tag ships with data-theme="dark". Anyone who has used
     the toggle has their choice in localStorage, and without this they would
     see a flash of the default before main.min.js corrected it on DOM ready. -->
<script>
  (function () {
    try {
      var saved = window.localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.removeAttribute('data-theme');
      } else if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) { /* private mode, storage blocked -- keep the default */ }
  })();
</script>

<!-- IBM Plex: Sans for prose, Mono for the chrome, Serif italic for captions.
     Source Serif 4 for headings and names. The families are set in
     _sass/_themes.scss. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital@1&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>

<!-- end custom head snippets -->
