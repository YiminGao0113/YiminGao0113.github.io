name: Jekyll build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]


permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # github-pages pins liquid 4.0.3, which calls String#tainted? --
          # removed in Ruby 3.2. 3.1 is the newest Ruby this stack runs on.
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
